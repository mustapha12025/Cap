name: inspect-installer-tmp

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID holding the windows-nsis-installer artifact"
        required: true
        default: "34976693998"

jobs:
  inspect:
    runs-on: windows-2022
    steps:
      - name: Download installer artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --name windows-nsis-installer --dir installer-artifact
          Get-ChildItem installer-artifact

      - name: List installer contents
        shell: pwsh
        run: |
          $sevenZip = Get-Command 7z -ErrorAction Stop
          $installer = Get-ChildItem -Path "installer-artifact" -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            throw "No installer exe found in artifact."
          }
          $contents = & $sevenZip.Source l -slt $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect installer."
          }
          $contents | Select-String "^Path = " | ForEach-Object { $_.Line } | Sort-Object | Get-Unique
          $requiredFiles = @(
            "Cap.exe", "cap-muxer.exe", "cap-exporter.exe", "cap-cli.exe", "cap-gpui.exe",
            "avcodec-61.dll", "avdevice-61.dll", "avfilter-10.dll", "avformat-61.dll",
            "avutil-59.dll", "postproc-58.dll", "swresample-5.dll", "swscale-8.dll",
            "dxcompiler.dll", "dxil.dll", "onnxruntime.dll", "onnxruntime_providers_shared.dll"
          )
          $missing = @()
          foreach ($file in $requiredFiles) {
            if ($contents -notcontains "Path = $file") {
              $missing += $file
            }
          }
          if ($missing.Count -gt 0) {
            throw "MISSING from installer: $($missing -join ', ')"
          }
          Write-Host "All required files are bundled."
